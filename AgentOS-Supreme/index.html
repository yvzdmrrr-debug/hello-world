<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src wss://stream.binance.com wss://data-stream.binance.vision; media-src 'self' blob:">
<title>AgentOS Supreme</title>
<style>
  :root { --mavi: #5ad7ff; --mor: #9d7bff; --yesil: #3ef0a6; --kirmizi: #ff5d7a; --cam: rgba(12, 22, 40, .46);
          --cizgi: rgba(120, 210, 255, .28); --metin: #dff4ff; --soluk: #7f9bb5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02040a; color: var(--metin);
               font: 16px/1.5 "Segoe UI", "Inter", system-ui, sans-serif; cursor: default; user-select: none; }
  canvas#sahne { position: fixed; inset: 0; width: 100%; height: 100%; }
  .izgara { position: fixed; inset: 0; pointer-events: none; opacity: .5;
            background: radial-gradient(ellipse at 50% 45%, transparent 35%, #02040a 85%),
                        repeating-linear-gradient(0deg, transparent 0 39px, rgba(90, 215, 255, .045) 39px 40px),
                        repeating-linear-gradient(90deg, transparent 0 39px, rgba(90, 215, 255, .045) 39px 40px); }

  /* karşılama */
  #karsilama { position: fixed; inset: 0; display: grid; place-content: center; text-align: center;
               transition: opacity 1.2s ease, transform 1.2s ease; }
  #karsilama h1 { margin: 0; font-weight: 200; font-size: clamp(34px, 6vw, 84px); letter-spacing: .32em;
                  text-indent: .32em; text-shadow: 0 0 34px rgba(90, 215, 255, .55); }
  #karsilama h1 b { font-weight: 600; color: var(--mavi); }
  #karsilama p { margin: 26px 0 0; color: var(--soluk); letter-spacing: .22em; font-size: 13px; text-transform: uppercase;
                 animation: nefes 2.6s ease-in-out infinite; }
  #karsilama small { display: block; margin-top: 12px; color: #55708a; letter-spacing: .08em; min-height: 1.5em; }
  body.uyanik #karsilama { opacity: 0; transform: scale(1.08); pointer-events: none; }
  @keyframes nefes { 50% { opacity: .35; } }

  /* üst durum çubuğu */
  #ust { position: fixed; top: 22px; left: 28px; right: 28px; display: flex; justify-content: space-between;
         font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--soluk);
         opacity: 0; transition: opacity 1s .6s; pointer-events: none; }
  body.uyanik #ust { opacity: 1; }
  #durum::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                   margin-right: 10px; background: var(--mavi); box-shadow: 0 0 12px var(--mavi); }
  #durum[data-d="dinliyor"]::before { background: var(--yesil); box-shadow: 0 0 14px var(--yesil); }
  #durum[data-d="konusuyor"]::before { background: var(--mor); box-shadow: 0 0 14px var(--mor); }
  #durum[data-d="dusunuyor"]::before { background: #ffd166; box-shadow: 0 0 14px #ffd166; animation: nefes 1s infinite; }

  /* altyazı */
  #altyazi { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); width: min(880px, 86vw);
             text-align: center; pointer-events: none; }
  #altyazi .sen { color: var(--soluk); font-size: 15px; min-height: 1.5em; }
  #altyazi .o { font-size: clamp(18px, 2vw, 26px); font-weight: 300; min-height: 1.6em;
                text-shadow: 0 0 22px rgba(90, 215, 255, .4); transition: opacity .4s; }

  /* yazılı komut */
  #komut { position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%); width: min(520px, 70vw);
           padding: 10px 18px; border-radius: 999px; border: 1px solid var(--cizgi); background: var(--cam);
           color: var(--metin); font: inherit; font-size: 14px; outline: none; text-align: center;
           backdrop-filter: blur(14px); opacity: 0; transition: opacity .6s, border-color .2s; }
  body.uyanik #komut { opacity: .55; }
  #komut:focus { opacity: 1; border-color: var(--mavi); }
  #komut::placeholder { color: #5d7892; }

  /* üretilen analiz paneli */
  .panel { position: fixed; top: 74px; right: 28px; width: min(470px, 40vw); max-height: calc(100vh - 190px);
           overflow: auto; padding: 18px; border-radius: 18px; border: 1px solid var(--cizgi); background: var(--cam);
           backdrop-filter: blur(18px) saturate(1.3); box-shadow: 0 0 60px rgba(40, 150, 255, .16), inset 0 0 40px rgba(90, 215, 255, .05);
           transform-origin: 100% 0; animation: belir .7s cubic-bezier(.2, .9, .2, 1) both; }
  .panel.kapaniyor { animation: kaybol .45s ease forwards; }
  .panel header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
                  font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--soluk); }
  .panel header b { color: var(--metin); font-weight: 500; }
  .canli { color: var(--yesil); } .canli::before { content: "● "; animation: nefes 1.2s infinite; }
  .canli.kopuk { color: var(--kirmizi); }
  .kart { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; align-items: center; padding: 12px 14px; margin-top: 10px;
          border-radius: 12px; border: 1px solid rgba(120, 210, 255, .14); background: rgba(8, 16, 30, .5);
          animation: belir .6s cubic-bezier(.2, .9, .2, 1) both; }
  .kart .ad { font-size: 13px; color: var(--soluk); letter-spacing: .08em; } .kart .ad b { color: var(--metin); margin-right: 8px; }
  .kart .fiyat { grid-row: span 2; font-size: 24px; font-weight: 300; font-variant-numeric: tabular-nums; text-align: right;
                 transition: color .5s; }
  .kart .fiyat.yukari { color: var(--yesil); } .kart .fiyat.asagi { color: var(--kirmizi); }
  .kart .degisim { font-size: 13px; font-variant-numeric: tabular-nums; }
  .arti { color: var(--yesil); } .eksi { color: var(--kirmizi); }
  .kart canvas { grid-column: 1 / -1; width: 100%; height: 38px; margin-top: 6px; }
  .kart .alt { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 11px; color: #6c88a3;
               font-variant-numeric: tabular-nums; }
  .panel footer { margin-top: 12px; font-size: 11px; color: #5d7892; }
  @keyframes belir { from { opacity: 0; transform: translateY(18px) scale(.94); filter: blur(8px); } }
  @keyframes kaybol { to { opacity: 0; transform: translateY(-14px) scale(.92); filter: blur(10px); } }

  /* onay penceresi */
  #onayKatman { position: fixed; inset: 0; display: grid; place-content: center; background: rgba(2, 4, 10, .5);
                backdrop-filter: blur(4px); animation: belirSade .3s both; }
  #onayKatman.kapaniyor { animation: kaybolSade .4s forwards; }
  .onay { width: min(480px, 86vw); padding: 26px 28px; border-radius: 18px; border: 1px solid var(--cizgi); background: rgba(10, 20, 38, .78);
          box-shadow: 0 0 80px rgba(90, 215, 255, .2); text-align: center; animation: belir .45s cubic-bezier(.2, .9, .2, 1) both; }
  #onayKatman.kapaniyor .onay { animation: kaybol .4s forwards; }
  .onay h2 { margin: 0 0 8px; font-weight: 400; font-size: 20px; letter-spacing: .06em; }
  .onay p { margin: 0 0 6px; color: var(--soluk); }
  .onay .ipucu { font-size: 12px; letter-spacing: .08em; color: #5d7892; margin: 14px 0 18px; }
  .onay .dugmeler { display: flex; gap: 12px; justify-content: center; }
  .onay button { min-width: 130px; padding: 11px 20px; border-radius: 999px; border: 1px solid var(--cizgi); background: transparent;
                 color: var(--metin); font: inherit; letter-spacing: .08em; cursor: pointer; transition: all .2s; }
  .onay button:hover, .onay button:focus-visible { background: rgba(90, 215, 255, .12); outline: none; }
  .onay button.evet { border-color: var(--yesil); color: var(--yesil); } .onay button.evet:hover { background: rgba(62, 240, 166, .14); }
  @keyframes belirSade { from { opacity: 0; } } @keyframes kaybolSade { to { opacity: 0; } }
  @media (max-width: 900px) { .panel { left: 16px; right: 16px; width: auto; top: 64px; } }
</style>
</head>
<body>
<canvas id="sahne"></canvas>
<div class="izgara"></div>

<section id="karsilama">
  <h1>AGENT<b>OS</b> SUPREME</h1>
  <p>"Hey AgentOS" deyin ya da ekrana tıklayın</p>
  <small id="hazirlik"></small>
</section>

<div id="ust"><span id="durum" data-d="hazir">Hazır</span><span id="saat"></span></div>
<div id="altyazi"><div class="sen" id="senMetin"></div><div class="o" id="oMetin"></div></div>
<input id="komut" placeholder="Konuşun ya da buraya yazın…" autocomplete="off" spellcheck="false">
<div id="paneller"></div>

<script src="mantik.js"></script>
<script src="arayuz.js"></script>
</body>
</html>
